<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>حضور و غیاب — Salehi ELC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #0a0a0c; color: #f2f2f0; font-family: Tahoma, 'Segoe UI', sans-serif; padding-bottom: 96px; }
  .view { display: none; }
  .view.active { display: block; }
  #dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(16,16,19,.96); backdrop-filter: blur(8px); border-top: 1px solid #26262b; display: flex; z-index: 8; padding-bottom: env(safe-area-inset-bottom); }
  .dock-btn { flex: 1; background: none; border: 0; color: #9c9ca3; font-family: inherit; font-size: 12px; padding: 8px 0 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dock-btn .dic { font-size: 20px; line-height: 1.2; }
  .dock-btn.active { color: #bef264; }
  .ov-wrap { overflow-x: auto; border: 1px solid #26262b; border-radius: 14px; background: #141417; }
  .ov-table { border-collapse: separate; border-spacing: 4px; padding: 6px; }
  .ov-table th, .ov-table td { text-align: center; }
  .ov-name { position: sticky; right: 0; background: #141417; text-align: right !important; padding: 6px 8px; font-size: 14px; white-space: nowrap; z-index: 2; }
  td.ov-cell { width: 34px; height: 34px; border-radius: 9px; font-size: 15px; }
  td.ov-cell.p { background: #1a2e05; border: 1px solid #3f6212; color: #bef264; }
  td.ov-cell.a { background: #2e0505; border: 1px solid #7f1d1d; color: #fca5a5; }
  .ov-date { font-size: 11px; color: #9c9ca3; white-space: nowrap; padding: 2px; font-weight: normal; }
  .ov-total { font-weight: bold; color: #fca5a5; font-size: 14px; }
  header { position: sticky; top: 0; background: #0a0a0cee; backdrop-filter: blur(6px); padding: 14px 16px 10px; border-bottom: 1px solid #26262b; z-index: 5; }
  h1 { margin: 0; font-size: 20px; color: #bef264; }
  .sub { font-size: 12px; color: #9c9ca3; margin-top: 2px; }
  #syncbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid #33333a; color: #d6d6da; }
  .pill.pending { border-color: #a16207; color: #fde68a; }
  .pill.ok { border-color: #3f6212; color: #bef264; }
  #syncBtn { margin-inline-start: auto; background: #bef264; color: #1a2e05; border: 0; font-weight: bold; padding: 7px 14px; border-radius: 10px; font-size: 13px; cursor: pointer; }
  #syncBtn:disabled { opacity: .45; }
  main { padding: 14px 16px; max-width: 560px; margin: 0 auto; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab { flex: 1; text-align: center; padding: 10px 4px; border-radius: 12px; border: 1px solid #33333a; background: #141417; color: #d6d6da; font-size: 15px; font-weight: bold; cursor: pointer; }
  .tab small { display: block; font-weight: normal; font-size: 11px; color: #9c9ca3; margin-top: 2px; }
  .tab.active { border-color: #bef264; color: #bef264; background: #1a2410; }
  .daterow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .daterow button { background: #141417; color: #f2f2f0; border: 1px solid #33333a; border-radius: 10px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
  #dateLabel { flex: 1; text-align: center; font-size: 15px; }
  #dateInput { background: #141417; color: #f2f2f0; border: 1px solid #33333a; border-radius: 10px; height: 40px; padding: 0 8px; font-size: 13px; color-scheme: dark; }
  .student { display: flex; align-items: center; gap: 10px; background: #141417; border: 1px solid #26262b; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; user-select: none; }
  .student .name { flex: 1; font-size: 16px; }
  .student .st { font-size: 14px; padding: 6px 12px; border-radius: 999px; min-width: 86px; text-align: center; }
  .st.present { background: #1a2e05; color: #bef264; border: 1px solid #3f6212; }
  .st.absent { background: #2e0505; color: #fca5a5; border: 1px solid #7f1d1d; }
  .st.late { background: #2e2305; color: #fde68a; border: 1px solid #a16207; }
  .student .del { color: #fca5a5; font-size: 18px; padding: 2px 6px; }
  .row-actions { display: flex; gap: 8px; margin: 14px 0; }
  .row-actions button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid #33333a; background: #141417; color: #d6d6da; font-size: 14px; cursor: pointer; }
  #saveBtn { width: 100%; padding: 15px; border: 0; border-radius: 14px; background: #bef264; color: #1a2e05; font-size: 17px; font-weight: bold; cursor: pointer; }
  #saveBtn:active { transform: scale(.99); }
  .hint { font-size: 12px; color: #9c9ca3; text-align: center; margin-top: 8px; line-height: 1.9; }
  h2 { font-size: 15px; color: #bef264; margin: 26px 0 10px; }
  .session { display: flex; align-items: center; gap: 8px; background: #141417; border: 1px solid #26262b; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
  .session .grow { flex: 1; }
  .session .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; }
  .badge.synced { background: #1a2e05; color: #bef264; }
  .badge.waiting { background: #2e2305; color: #fde68a; }
  #toast { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1d1d21; border: 1px solid #3f6212; color: #bef264; padding: 11px 20px; border-radius: 999px; font-size: 14px; transition: transform .25s; z-index: 9; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .addrow { display: none; gap: 8px; margin-bottom: 10px; }
  .addrow.open { display: flex; }
  .addrow input { flex: 1; background: #141417; border: 1px solid #33333a; border-radius: 10px; color: #f2f2f0; padding: 10px; font-size: 14px; }
  .addrow button { background: #bef264; color: #1a2e05; border: 0; border-radius: 10px; padding: 0 16px; font-weight: bold; cursor: pointer; }
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cal-head button { background: #141417; color: #f2f2f0; border: 1px solid #33333a; border-radius: 10px; width: 40px; height: 36px; font-size: 17px; cursor: pointer; }
  #calLabel { flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: #bef264; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .cal-week span { text-align: center; font-size: 12px; color: #9c9ca3; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-cell { position: relative; background: #141417; border: 1px solid #26262b; border-radius: 10px; min-height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; padding: 3px 0; }
  .cal-cell.empty { background: transparent; border: 0; cursor: default; }
  .cal-cell.today { border-color: #bef264; }
  .cal-cell.selected { background: #1a2410; border-color: #bef264; }
  .cal-cell .abs-badge { font-size: 10px; color: #fca5a5; background: #2e0505; border: 1px solid #7f1d1d; border-radius: 999px; padding: 0 6px; margin-top: 2px; }
  .cal-cell .rec-dot { width: 5px; height: 5px; border-radius: 50%; background: #3f6212; margin-top: 3px; }
  #calDetail { margin-top: 12px; }
  .cal-day-box { background: #141417; border: 1px solid #3f6212; border-radius: 14px; padding: 12px 14px; }
  .cal-day-box h3 { margin: 0 0 8px; font-size: 14px; color: #bef264; }
  .cal-day-box .cls { margin-bottom: 8px; font-size: 14px; line-height: 2; }
  .cal-day-box .cls b { color: #f2f2f0; }
  .cal-day-box .absent-name { color: #fca5a5; }
  .cal-day-box .all-ok { color: #9c9ca3; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>📋 حضور و غیاب</h1>
  <div class="sub">Salehi Language Academy</div>
  <div id="syncbar">
    <span class="pill" id="netPill">…</span>
    <span class="pill ok" id="pendPill">همه ثبت شده ✓</span>
    <button id="syncBtn">☁️ همگام‌سازی</button>
  </div>
</header>
<main>
  <section id="view-home" class="view active">
  <div class="tabs" id="tabs"></div>
  <div class="daterow">
    <button id="prevDay" title="روز قبل">›</button>
    <div id="dateLabel"></div>
    <input type="date" id="dateInput">
    <button id="nextDay" title="روز بعد">‹</button>
  </div>
  <div class="addrow" id="addRow">
    <input id="newName" placeholder="نام دانش‌آموز جدید…">
    <button id="addBtn">افزودن</button>
  </div>
  <div id="students"></div>
  <div class="row-actions">
    <button id="allPresent">✅ همه حاضر</button>
    <button id="editRoster">✏️ ویرایش اسامی</button>
  </div>
  <button id="saveBtn">ثبت حضور و غیاب</button>
  <div class="hint">با لمس هر اسم، وضعیت عوض می‌شود: حاضر ← غایب<br>ثبت‌ها اول روی گوشی ذخیره می‌شوند و با اولین اینترنت، خودکار به گوگل شیت می‌روند.</div>
  <h2>ثبت‌های قبلی</h2>
  <div id="sessions"></div>
  </section>
  <section id="view-overview" class="view">
  <div class="tabs" id="ovTabs"></div>
  <div class="ov-wrap"><div id="ovGrid"></div></div>
  <div class="hint">هر ستون یک جلسه است: ✓ یعنی حاضر و ✕ یعنی غایب.<br>ستون آخر، تعداد کل غیبت‌های هر دانش‌آموز است.</div>
  </section>
  <section id="view-cal" class="view">
  <div class="cal-head">
    <button id="calPrev" title="ماه قبل">›</button>
    <div id="calLabel"></div>
    <button id="calNext" title="ماه بعد">‹</button>
  </div>
  <div class="cal-week"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div>
  <div class="cal-grid" id="calGrid"></div>
  <div id="calDetail"></div>
  </section>
</main>
<nav id="dock">
  <button class="dock-btn active" data-view="view-home"><span class="dic">🏠</span>صفحه اصلی</button>
  <button class="dock-btn" data-view="view-overview"><span class="dic">📋</span>دید کلی</button>
  <button class="dock-btn" data-view="view-cal"><span class="dic">📅</span>تقویم</button>
</nav>
<div id="toast"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzsgfHWGM0rlmUFt1DYGpIipnp-HDlV7qLTFUHGwdsLcXUNmmkCJwbwFnuqTafXYyVk/exec';
const APP_KEY = 'att-salehi-2026';
const CLASSES = [
  { id: 'ARC 10', label: 'ARC 10', time: '۲۰:۴۵ – ۲۲:۱۵', days: [6, 1, 3] },
  { id: 'ARC 21', label: 'ARC 21', time: '۱۷:۳۰ – ۱۹:۰۰', days: [0, 2, 4] },
  { id: 'ARC 13', label: 'ARC 13', time: '۲۰:۴۵ – ۲۲:۰۰', days: [0, 2, 4] }
];
const DEFAULT_ROSTERS = {
  'ARC 10': ['Aram', 'Narjes', 'Hasti', 'Zahra', 'Sahar', 'Yazdan'],
  'ARC 21': ['Aram', 'Erfan', 'Bahar', 'Sima', 'Neda', 'Yasaman'],
  'ARC 13': ['Fatemeh', 'Nina', 'Zahra', 'Aylar', 'Shahrad', 'Somayeh', 'Bahar']
};
const STATUS = {
  present: { fa: '✅ حاضر', next: 'absent' },
  absent: { fa: '❌ غایب', next: 'present' }
};
const LS_REC = 'att_records_v1', LS_ROS = 'att_rosters_v1';
let rosters = JSON.parse(localStorage.getItem(LS_ROS) || 'null') || JSON.parse(JSON.stringify(DEFAULT_ROSTERS));
let records = JSON.parse(localStorage.getItem(LS_REC) || '{}');
Object.values(records).forEach(r => Object.keys(r.entries || {}).forEach(n => { if (r.entries[n] === 'late') r.entries[n] = 'present'; }));
let curClass = pickClassForNow();
let curDate = todayISO();
let marks = {}; // name -> status for the open session
let editing = false;

function todayISO(d) {
  d = d || new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function pickClassForNow() {
  const now = new Date(), day = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
  const todays = CLASSES.filter(c => c.days.includes(day));
  if (!todays.length) return 'ARC 10';
  if (todays.length === 1) return todays[0].id;
  return mins < 19 * 60 + 30 ? todays[0].id : todays[todays.length - 1].id;
}
function key() { return curDate + '|' + curClass; }
function persist() {
  localStorage.setItem(LS_REC, JSON.stringify(records));
  localStorage.setItem(LS_ROS, JSON.stringify(rosters));
}
function loadMarks() {
  marks = {};
  (rosters[curClass] || []).forEach(n => marks[n] = 'present');
  const rec = records[key()];
  if (rec) Object.keys(rec.entries).forEach(n => { marks[n] = STATUS[rec.entries[n]] ? rec.entries[n] : 'present'; });
}
function renderTabs() {
  document.getElementById('tabs').innerHTML = CLASSES.map(c =>
    '<div class="tab' + (c.id === curClass ? ' active' : '') + '" data-id="' + c.id + '">' + c.label + '<small>' + c.time + '</small></div>').join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { curClass = t.dataset.id; loadMarks(); render(); });
}
function renderDate() {
  const d = new Date(curDate + 'T12:00:00');
  document.getElementById('dateLabel').textContent = d.toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('dateInput').value = curDate;
}
function renderStudents() {
  const names = Object.keys(marks);
  document.getElementById('students').innerHTML = names.map(n =>
    '<div class="student" data-name="' + n.replace(/"/g, '&quot;') + '"><span class="name">' + n + '</span>' +
    (editing ? '<span class="del" data-del="' + n.replace(/"/g, '&quot;') + '">✕</span>' : '') +
    '<span class="st ' + marks[n] + '">' + STATUS[marks[n]].fa + '</span></div>').join('');
  document.querySelectorAll('.student').forEach(el => el.onclick = e => {
    const n = el.dataset.name;
    if (e.target.dataset.del) {
      if (confirm('«' + n + '» از لیست ' + curClass + ' حذف شود؟')) {
        rosters[curClass] = rosters[curClass].filter(x => x !== n);
        delete marks[n]; persist(); renderStudents();
      }
      return;
    }
    marks[n] = STATUS[marks[n]].next; renderStudents();
  });
}
function renderSessions() {
  const list = Object.values(records).sort((a, b) => (b.date + b.className).localeCompare(a.date + a.className));
  document.getElementById('sessions').innerHTML = list.length ? list.map(r => {
    const d = new Date(r.date + 'T12:00:00');
    const cnt = Object.values(r.entries);
    return '<div class="session" data-k="' + r.date + '|' + r.className + '"><span class="grow">' +
      d.toLocaleDateString('fa-IR', { weekday: 'short', day: 'numeric', month: 'long' }) + ' — ' + r.className +
      ' <span style="color:#9c9ca3">(' + cnt.filter(s => s === 'present').length + ' حاضر، ' + cnt.filter(s => s === 'absent').length + ' غایب)</span></span>' +
      '<span class="badge ' + (r.synced ? 'synced' : 'waiting') + '">' + (r.synced ? 'ثبت در شیت ✓' : 'در انتظار اینترنت') + '</span></div>';
  }).join('') : '<div class="hint">هنوز ثبتی ندارید.</div>';
  document.querySelectorAll('.session').forEach(el => el.onclick = () => {
    const parts = el.dataset.k.split('|');
    curDate = parts[0]; curClass = parts[1]; loadMarks(); render();
    switchView('view-home');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
function renderSync() {
  const pend = Object.values(records).filter(r => !r.synced).length;
  const pill = document.getElementById('pendPill');
  if (pend) { pill.textContent = pend + ' ثبت در انتظار همگام‌سازی'; pill.className = 'pill pending'; }
  else { pill.textContent = 'همه ثبت شده ✓'; pill.className = 'pill ok'; }
  const net = document.getElementById('netPill');
  net.textContent = navigator.onLine ? '🟢 آنلاین' : '🔴 آفلاین';
}
function render() { renderTabs(); renderDate(); renderStudents(); renderSessions(); renderSync(); renderCalendar(); renderOverview(); }

/* ---------- Views + overview grid ---------- */
let ovClass = null;
function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  document.querySelectorAll('.dock-btn').forEach(b => b.classList.toggle('active', b.dataset.view === id));
  if (id === 'view-overview') renderOverview();
  if (id === 'view-cal') renderCalendar();
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.dock-btn').forEach(b => b.onclick = () => switchView(b.dataset.view));
function renderOverview() {
  const tabs = document.getElementById('ovTabs');
  if (!tabs) return;
  if (!ovClass) ovClass = curClass;
  tabs.innerHTML = CLASSES.map(c =>
    '<div class="tab' + (c.id === ovClass ? ' active' : '') + '" data-id="' + c.id + '">' + c.label + '</div>').join('');
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { ovClass = t.dataset.id; renderOverview(); });
  const sessions = Object.values(records).filter(r => r.className === ovClass).sort((a, b) => a.date.localeCompare(b.date));
  const grid = document.getElementById('ovGrid');
  if (!sessions.length) { grid.innerHTML = '<div class="hint" style="padding:16px;">برای این کلاس هنوز ثبتی نیست.</div>'; return; }
  const names = (rosters[ovClass] || []).slice();
  sessions.forEach(s => Object.keys(s.entries).forEach(n => { if (names.indexOf(n) === -1) names.push(n); }));
  let html = '<table class="ov-table"><tr><th class="ov-name">دانش‌آموز</th>';
  sessions.forEach(s => { const j = isoToJalali(s.date); html += '<th class="ov-date">' + faNum(j.jd) + '/' + faNum(j.jm) + '</th>'; });
  html += '<th class="ov-date">غیبت</th></tr>';
  names.forEach(n => {
    let abs = 0;
    html += '<tr><td class="ov-name">' + n + '</td>';
    sessions.forEach(s => {
      const v = s.entries[n];
      if (v === 'absent') { abs++; html += '<td class="ov-cell a">✕</td>'; }
      else if (v === 'present') html += '<td class="ov-cell p">✓</td>';
      else html += '<td class="ov-cell">—</td>';
    });
    html += '<td class="ov-total">' + (abs ? faNum(abs) : '—') + '</td></tr>';
  });
  grid.innerHTML = html + '</table>';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function apiPost(action, payload) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, key: APP_KEY }, payload)) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

let syncing = false;
async function syncNow(manual) {
  const pend = Object.values(records).filter(r => !r.synced);
  renderSync();
  if (!pend.length) { if (manual) toast('همه‌ی ثبت‌ها قبلاً همگام شده‌اند ✓'); return; }
  if (!navigator.onLine) { if (manual) toast('اینترنت نیست — ثبت‌ها روی گوشی می‌مانند 📱'); return; }
  if (syncing) return;
  syncing = true;
  document.getElementById('syncBtn').disabled = true;
  try {
    const res = await apiPost('saveAttendance', { records: pend });
    if (res && res.ok) {
      pend.forEach(r => { records[r.date + '|' + r.className].synced = true; });
      persist(); toast('به گوگل شیت ثبت شد ☁️✓');
    } else throw new Error('bad response');
  } catch (e) {
    if (manual) toast('همگام‌سازی نشد — بعداً خودکار تلاش می‌شود');
  }
  syncing = false;
  document.getElementById('syncBtn').disabled = false;
  render();
}

document.getElementById('saveBtn').onclick = () => {
  records[key()] = { date: curDate, className: curClass, entries: Object.assign({}, marks), updatedAt: new Date().toISOString(), synced: false };
  persist(); render();
  toast(navigator.onLine ? 'ذخیره شد ✓ در حال ثبت به شیت…' : 'ذخیره شد روی گوشی ✓ (آفلاین)');
  syncNow(false);
};
document.getElementById('allPresent').onclick = () => { Object.keys(marks).forEach(n => marks[n] = 'present'); renderStudents(); };
document.getElementById('editRoster').onclick = () => {
  editing = !editing;
  document.getElementById('addRow').classList.toggle('open', editing);
  document.getElementById('editRoster').textContent = editing ? '✔️ پایان ویرایش' : '✏️ ویرایش اسامی';
  renderStudents();
};
document.getElementById('addBtn').onclick = () => {
  const inp = document.getElementById('newName');
  const n = inp.value.trim();
  if (!n) return;
  if (!rosters[curClass].includes(n)) rosters[curClass].push(n);
  if (!(n in marks)) marks[n] = 'present';
  inp.value = ''; persist(); renderStudents();
};
document.getElementById('prevDay').onclick = () => { const d = new Date(curDate + 'T12:00:00'); d.setDate(d.getDate() - 1); curDate = todayISO(d); loadMarks(); render(); };
document.getElementById('nextDay').onclick = () => { const d = new Date(curDate + 'T12:00:00'); d.setDate(d.getDate() + 1); curDate = todayISO(d); loadMarks(); render(); };
document.getElementById('dateInput').onchange = e => { if (e.target.value) { curDate = e.target.value; loadMarks(); render(); } };
document.getElementById('syncBtn').onclick = () => syncNow(true);
window.addEventListener('online', () => { renderSync(); syncNow(false); pullFromServer(); });
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(false); });

/* ---------- Jalali calendar ---------- */
function _div(a, b) { return ~~(a / b); }
function _mod(a, b) { return a - ~~(a / b) * b; }
const JBREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
function jalCal(jy) {
  const bl = JBREAKS.length, gy = jy + 621;
  let leapJ = -14, jp = JBREAKS[0], jm, jump, leap, n, i;
  for (i = 1; i < bl; i++) { jm = JBREAKS[i]; jump = jm - jp; if (jy < jm) break; leapJ += _div(jump, 33) * 8 + _div(_mod(jump, 33), 4); jp = jm; }
  n = jy - jp;
  leapJ += _div(n, 33) * 8 + _div(_mod(n, 33) + 3, 4);
  if (_mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = _div(gy, 4) - _div((_div(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + _div(jump + 4, 33) * 33;
  leap = _mod(_mod(n + 1, 33) - 1, 4);
  if (leap === -1) leap = 4;
  return { leap: leap, gy: gy, march: march };
}
function j2d(jy, jm, jd) {
  const r = jalCal(jy);
  return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - _div(jm, 7) * (jm - 7) + jd - 1;
}
function d2j(jdn) {
  const gy = d2g(jdn).gy, jy = gy - 621, r = jalCal(jy);
  const jdn1f = g2d(gy, 3, r.march);
  let jd = jdn - jdn1f, jm, k;
  if (jd >= 0) {
    if (jd <= 185) { jm = 1 + _div(jd, 31); jd = _mod(jd, 31); return { jy: jy, jm: jm, jd: jd + 1 }; }
    jd -= 186;
  } else {
    const jy2 = jy - 1;
    jd += 179;
    if (r.leap === 1) jd += 1;
    if (jd <= 185) { jm = 7 + _div(jd, 30); jd = _mod(jd, 30); return { jy: jy2, jm: jm, jd: jd + 1 }; }
    jd -= 186;
    return { jy: jy2, jm: 12, jd: jd + 1 };
  }
  jm = 7 + _div(jd, 30); k = _mod(jd, 30);
  return { jy: jy, jm: jm, jd: k + 1 };
}
function g2d(gy, gm, gd) {
  let d = _div((gy + _div(gm - 8, 6) + 100100) * 1461, 4) + _div(153 * _mod(gm + 9, 12) + 2, 5) + gd - 34840408;
  d = d - _div(_div(gy + 100100 + _div(gm - 8, 6), 100) * 3, 4) + 752;
  return d;
}
function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j += _div(_div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = _div(_mod(j, 1461), 4) * 5 + 308;
  const gd = _div(_mod(i, 153), 5) + 1, gm = _mod(_div(i, 153), 12) + 1, gy = _div(j, 1461) - 100100 + _div(8 - gm, 6);
  return { gy: gy, gm: gm, gd: gd };
}
function toJalaali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }
function toGregorian(jy, jm, jd) { return d2g(j2d(jy, jm, jd)); }
function jalaliMonthLength(jy, jm) {
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return jalCal(jy).leap === 0 ? 30 : 29;
}
const JMONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
function faNum(n) { return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function isoToJalali(iso) {
  const p = iso.split('-').map(Number);
  return toJalaali(p[0], p[1], p[2]);
}
function jalaliToISO(jy, jm, jd) {
  const g = toGregorian(jy, jm, jd), p = n => String(n).padStart(2, '0');
  return g.gy + '-' + p(g.gm) + '-' + p(g.gd);
}
const _nowJ = (() => { const t = new Date(); return toJalaali(t.getFullYear(), t.getMonth() + 1, t.getDate()); })();
let calJY = _nowJ.jy, calJM = _nowJ.jm, calSel = null; // selected Jalali day {jy,jm,jd}

function dayData(jy, jm, jd) {
  const iso = jalaliToISO(jy, jm, jd);
  const sessions = Object.values(records).filter(r => r.date === iso);
  let absents = 0;
  sessions.forEach(s => Object.values(s.entries).forEach(v => { if (v === 'absent') absents++; }));
  return { iso: iso, sessions: sessions, absents: absents };
}
function renderCalendar() {
  const grid = document.getElementById('calGrid');
  if (!grid) return;
  document.getElementById('calLabel').textContent = JMONTHS[calJM - 1] + ' ' + faNum(calJY);
  const len = jalaliMonthLength(calJY, calJM);
  const firstG = toGregorian(calJY, calJM, 1);
  const firstDow = new Date(firstG.gy, firstG.gm - 1, firstG.gd).getDay(); // 0 Sun .. 6 Sat
  const startCol = (firstDow + 1) % 7; // Saturday-first columns
  let html = '';
  for (let i = 0; i < startCol; i++) html += '<div class="cal-cell empty"></div>';
  for (let d = 1; d <= len; d++) {
    const data = dayData(calJY, calJM, d);
    const isToday = _nowJ.jy === calJY && _nowJ.jm === calJM && _nowJ.jd === d;
    const isSel = calSel && calSel.jy === calJY && calSel.jm === calJM && calSel.jd === d;
    html += '<div class="cal-cell' + (isToday ? ' today' : '') + (isSel ? ' selected' : '') + '" data-day="' + d + '">' + faNum(d) +
      (data.absents ? '<span class="abs-badge">❌ ' + faNum(data.absents) + ' غایب</span>' : (data.sessions.length ? '<span class="rec-dot"></span>' : '')) + '</div>';
  }
  grid.innerHTML = html;
  grid.querySelectorAll('.cal-cell[data-day]').forEach(el => el.onclick = () => {
    calSel = { jy: calJY, jm: calJM, jd: Number(el.dataset.day) };
    renderCalendar();
  });
  renderCalDetail();
}
function renderCalDetail() {
  const box = document.getElementById('calDetail');
  if (!calSel) { box.innerHTML = '<div class="hint">روی هر روز بزنید تا غایب‌های آن روز را ببینید.</div>'; return; }
  const data = dayData(calSel.jy, calSel.jm, calSel.jd);
  const g = new Date(data.iso + 'T12:00:00');
  const title = g.toLocaleDateString('fa-IR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  if (!data.sessions.length) {
    box.innerHTML = '<div class="cal-day-box"><h3>' + title + '</h3><div class="all-ok">برای این روز ثبتی نیست.</div></div>';
    return;
  }
  let html = '<div class="cal-day-box"><h3>' + title + '</h3>';
  data.sessions.sort((a, b) => a.className.localeCompare(b.className)).forEach(s => {
    const abs = Object.keys(s.entries).filter(n => s.entries[n] === 'absent');
    html += '<div class="cls"><b>' + s.className + ':</b> ' +
      (abs.length ? abs.map(n => '<span class="absent-name">❌ ' + n + '</span>').join('، ') : '<span class="all-ok">همه حاضر بودند ✓</span>') + '</div>';
  });
  box.innerHTML = html + '</div>';
}
document.getElementById('calPrev').onclick = () => {
  calJM--; if (calJM < 1) { calJM = 12; calJY--; }
  renderCalendar();
};
document.getElementById('calNext').onclick = () => {
  calJM++; if (calJM > 12) { calJM = 1; calJY++; }
  renderCalendar();
};

async function pullFromServer() {
  if (!navigator.onLine || API_URL.indexOf('http') !== 0) return;
  try {
    const r = await fetch(API_URL + '?action=read&key=' + encodeURIComponent(APP_KEY));
    const data = await r.json();
    if (!data || !data.ok) return;
    let changed = false;
    (data.sessions || []).forEach(s => {
      const k = s.date + '|' + s.className;
      if (records[k] && !records[k].synced) return; // keep unsynced local edits
      const entries = {};
      Object.keys(s.entries).forEach(n => {
        const v = String(s.entries[n]);
        entries[n] = v.indexOf('❌') === 0 ? 'absent' : 'present';
      });
      records[k] = { date: s.date, className: s.className, entries: entries, updatedAt: records[k] ? records[k].updatedAt : '', synced: true };
      changed = true;
    });
    if (changed) { persist(); render(); }
  } catch (e) {}
}

loadMarks();
render();
syncNow(false);
pullFromServer();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
